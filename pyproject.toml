[project]
name = "crk-io-board"
# 버전 단일 소스는 src/io_board/__init__.py의 __version__ (CHANGELOG.md 최신
# 버전과 일치). 이 값도 동일하게 유지할 것.
version = "2.0.7"
description = "IO Board interface for CRK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "construct>=2.10.0",
    "fastapi[standard]>=0.109.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.12.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "starlette>=0.50.0",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "construct-typing>=0.7.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# 각 테스트 파일의 sys.path 조작 대신 여기서 src/를 import 경로에 추가한다.
pythonpath = ["src"]
testpaths = ["tests"]
